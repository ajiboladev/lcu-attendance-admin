<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | LCU Attendance</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="css/style.css?v=4"><link rel="modulepreload" href="js/core.js"><link rel="modulepreload" href="js/dashboard.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js"></head><body><div id="boot"><div class="spin"></div></div><header><img src="assets/logo.png" alt="Lead City University logo"><b>LCU Attendance</b></header><main class="wide"><div class="card" id="box"><div class="top"><h1>Admin dashboard</h1><div class="btns"><button id="newrep">Create rep</button><button id="out" class="ghost">Log out</button></div></div><div class="stats"><div class="stat"><b id="total">-</b>Registered students</div><div class="stat"><b id="reps">-</b>Course reps</div></div><label>Search by email or matric number<input id="q" placeholder="e.g. 20/1234 or name@mail.com" autocomplete="off" maxlength="100"></label><div class="alert" role="alert" hidden></div><div class="btns"><button id="sStu">Search students</button><button id="sRep" class="ghost">Search reps (empty = all)</button></div><div class="tbl" id="res"></div><dialog id="rd" class="big"><h2>Create course rep</h2><form id="rf" novalidate><div id="rfields"></div><div class="alert" role="alert" hidden></div><button id="rgo" type="submit">Create rep account</button><button id="rcancel" type="button" class="ghost">Cancel</button></form></dialog><dialog id="ed" class="big"><h2>Edit student</h2><form id="ef" novalidate><div id="efields"></div><label class="check"><input type="checkbox" id="resetDev"> Reset device (student can bind a new phone on next login)</label><button id="resetPw"
